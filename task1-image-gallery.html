<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperture — Image Gallery</title>
<style>
  :root{
    --bg: #14130f;
    --bg-raised: #1c1b16;
    --line: #33322a;
    --ink: #f2ede2;
    --ink-dim: #a9a397;
    --accent: #d99a3f;
    --accent-dim: #8a6a35;
    --radius: 2px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family: "Georgia", "Iowan Old Style", serif;
  }

  header{
    padding: 3.5rem 6vw 2rem;
    border-bottom: 1px solid var(--line);
  }

  header h1{
    margin:0;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  header p{
    margin: 0.6rem 0 0;
    color: var(--ink-dim);
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.95rem;
    max-width: 46ch;
    line-height: 1.5;
  }

  .filters{
    display:flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.6rem;
    padding: 1.4rem 6vw 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .filters button{
    background:none;
    border:none;
    color: var(--ink-dim);
    font-size: 0.9rem;
    padding: 0.3rem 0;
    cursor:pointer;
    position:relative;
    letter-spacing: 0.02em;
  }

  .filters button::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  .filters button:hover{ color: var(--ink); }
  .filters button.active{ color: var(--accent); }
  .filters button.active::after{ transform: scaleX(1); }

  main{
    padding: 2.5rem 6vw 5rem;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.4rem;
  }

  figure{
    margin:0;
    position:relative;
    overflow:hidden;
    background: var(--bg-raised);
    border-radius: var(--radius);
    cursor: pointer;
    aspect-ratio: 4 / 5;
  }

  figure img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
    filter: saturate(0.9);
  }

  figure:hover img{
    transform: scale(1.06);
    filter: saturate(1.05);
  }

  figcaption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding: 0.9rem 1rem 0.8rem;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  figure:hover figcaption{
    opacity: 1;
    transform: translateY(0);
  }

  .hidden{ display:none !important; }

  /* Lightbox */
  .lightbox{
    position: fixed;
    inset:0;
    background: rgba(10,9,7,0.94);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 100;
    opacity:0;
    visibility:hidden;
    transition: opacity 0.3s ease;
  }

  .lightbox.open{
    opacity:1;
    visibility: visible;
  }

  .lightbox-stage{
    position:relative;
    max-width: 86vw;
    max-height: 82vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 0.9rem;
  }

  .lightbox-stage img{
    max-width: 86vw;
    max-height: 70vh;
    object-fit:contain;
    border-radius: var(--radius);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .lightbox-caption{
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink-dim);
    font-size: 0.9rem;
    text-align:center;
  }

  .lightbox-close, .lightbox-nav{
    position:absolute;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    cursor:pointer;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.1rem;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .lightbox-close:hover, .lightbox-nav:hover{
    border-color: var(--accent);
    color: var(--accent);
  }

  .lightbox-close{
    top: -3.2rem;
    right: 0;
  }

  .lightbox-nav.prev{ left: -3.6rem; top: 50%; transform: translateY(-50%); }
  .lightbox-nav.next{ right: -3.6rem; top: 50%; transform: translateY(-50%); }

  @media (max-width: 720px){
    .lightbox-nav.prev{ left: 0.4rem; }
    .lightbox-nav.next{ right: 0.4rem; }
    .lightbox-close{ top: 0.6rem; right: 0.6rem; background: rgba(0,0,0,0.4); }
  }

  footer{
    padding: 2rem 6vw 3rem;
    color: var(--ink-dim);
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.8rem;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <h1>Aperture</h1>
  <p>A small gallery of moments. Click any frame to step through it full‑screen, or filter by category below.</p>
</header>

<nav class="filters" id="filters"></nav>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>Use arrow keys or the on‑screen arrows to navigate an open image. Esc closes it.</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-stage">
    <button class="lightbox-close" id="closeBtn" aria-label="Close">&#10005;</button>
    <button class="lightbox-nav prev" id="prevBtn" aria-label="Previous">&#8592;</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <button class="lightbox-nav next" id="nextBtn" aria-label="Next">&#8594;</button>
  </div>
</div>

<script>
  const photos = [
    { src: "https://picsum.photos/seed/aperture-1/800/1000", title: "Coastline, dusk", category: "landscape" },
    { src: "https://picsum.photos/seed/aperture-2/800/1000", title: "Old quarter", category: "urban" },
    { src: "https://picsum.photos/seed/aperture-3/800/1000", title: "Portrait study", category: "people" },
    { src: "https://picsum.photos/seed/aperture-4/800/1000", title: "Mountain pass", category: "landscape" },
    { src: "https://picsum.photos/seed/aperture-5/800/1000", title: "Night market", category: "urban" },
    { src: "https://picsum.photos/seed/aperture-6/800/1000", title: "Quiet hands", category: "people" },
    { src: "https://picsum.photos/seed/aperture-7/800/1000", title: "River bend", category: "landscape" },
    { src: "https://picsum.photos/seed/aperture-8/800/1000", title: "Rooftops", category: "urban" },
    { src: "https://picsum.photos/seed/aperture-9/800/1000", title: "Passing glance", category: "people" },
    { src: "https://picsum.photos/seed/aperture-10/800/1000", title: "Fog over the ridge", category: "landscape" },
    { src: "https://picsum.photos/seed/aperture-11/800/1000", title: "Crosswalk", category: "urban" },
    { src: "https://picsum.photos/seed/aperture-12/800/1000", title: "Workshop", category: "people" },
  ];

  const grid = document.getElementById("grid");
  const filtersEl = document.getElementById("filters");
  const categories = ["all", ...new Set(photos.map(p => p.category))];

  let activeCategory = "all";
  let currentIndex = 0;

  function visiblePhotos(){
    return activeCategory === "all" ? photos : photos.filter(p => p.category === activeCategory);
  }

  function renderFilters(){
    filtersEl.innerHTML = "";
    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.textContent = cat;
      if (cat === activeCategory) btn.classList.add("active");
      btn.addEventListener("click", () => {
        activeCategory = cat;
        renderFilters();
        renderGrid();
      });
      filtersEl.appendChild(btn);
    });
  }

  function renderGrid(){
    grid.innerHTML = "";
    visiblePhotos().forEach((photo, idx) => {
      const fig = document.createElement("figure");
      fig.innerHTML = `<img src="${photo.src}" alt="${photo.title}" loading="lazy">
                        <figcaption>${photo.title}</figcaption>`;
      fig.addEventListener("click", () => openLightbox(idx));
      grid.appendChild(fig);
    });
  }

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxCaption = document.getElementById("lightboxCaption");

  function openLightbox(idx){
    currentIndex = idx;
    updateLightbox();
    lightbox.classList.add("open");
  }

  function updateLightbox(){
    const list = visiblePhotos();
    const photo = list[currentIndex];
    lightboxImg.src = photo.src;
    lightboxImg.alt = photo.title;
    lightboxCaption.textContent = `${photo.title} — ${currentIndex + 1} / ${list.length}`;
  }

  function closeLightbox(){
    lightbox.classList.remove("open");
  }

  function step(delta){
    const list = visiblePhotos();
    currentIndex = (currentIndex + delta + list.length) % list.length;
    updateLightbox();
  }

  document.getElementById("closeBtn").addEventListener("click", closeLightbox);
  document.getElementById("prevBtn").addEventListener("click", () => step(-1));
  document.getElementById("nextBtn").addEventListener("click", () => step(1));

  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  renderFilters();
  renderGrid();
</script>

</body>
</html>
